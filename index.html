<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formal Night Check-In</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1f1a10 0%, #0a0a0a 75%);
      color: #f5e6c8;
      font-family: 'Georgia', serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #121212;
      border: 2px solid #d4af37;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
    }
    .event-title {
      color: #d4af37;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin: 10px 0;
      font-size: 28px;
    }
    h2 {
      color: #ffffff;
      font-size: 20px;
      font-weight: normal;
      margin-top: 15px;
      line-height: 1.4;
    }
    .success {
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }
    .error {
      color: #ff5c5c;
    }
    .loading {
      color: #d4af37;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="event-title">✨ Formal Night VIP Pass ✨</div>
    <div id="result">
      <h1 class="loading">Loading...</h1>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase-config.js';
    import { students } from './students.js';
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    async function checkIn() {
      const resultDiv = document.getElementById("result");

      try {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id || !students[id]) {
          resultDiv.innerHTML = "<h1 class='error'>Invalid QR Code</h1>";
          return;
        }

        const ref = doc(db, "attendance", id);
        const existing = await getDoc(ref);

        if (existing.exists()) {
          resultDiv.innerHTML = `
            <h1 class="error">Already Checked In</h1>
            <h2>${students[id]}</h2>
          `;
        } else {
          await setDoc(ref, {
            studentId: id,
            studentName: students[id],
            checkInTime: new Date().toISOString()
          });

          resultDiv.innerHTML = `
            <h1 class="success">✅ Checked In</h1>
            <h2>${students[id]}</h2>
          `;
        }
      } catch (error) {
        console.error("Check-in error:", error);
        resultDiv.innerHTML = `
          <h1 class="error">System Error</h1>
          <p>${error.message}</p>
        `;
      }
    }

    checkIn();
  </script>

</body>
</html>
