<!DOCTYPE html>
<html>
<head>
<title>Attendance Dashboard</title>

<style>
body{
font-family:Arial;
margin:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border:1px solid #ccc;
}

th{
background:#1976d2;
color:white;
}
</style>
</head>

<body>

<h1>🎓 Formal Night Attendance Dashboard</h1>

<h2 id="count">Present: 0</h2>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Check-In Time</th>
</tr>
</thead>

<tbody id="attendance"></tbody>

</table>

<script type="module">

import { db } from './firebase-config.js';

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

async function loadAttendance(){

const tbody =
document.getElementById("attendance");

tbody.innerHTML="";

const attendance =
await getDocs(collection(db,"attendance"));

let count = 0;

attendance.forEach(doc=>{

count++;

const data = doc.data();

tbody.innerHTML += `
<tr>
<td>${data.studentId}</td>
<td>${data.studentName}</td>
<td>${new Date(data.checkInTime).toLocaleString()}</td>
</tr>
`;

});

document.getElementById("count").textContent =
`Present: ${count}`;

}

loadAttendance();

setInterval(loadAttendance,5000);

</script>

</body>
</html>
